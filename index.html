<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#f25f3a" />
  <meta name="description" content="Mise is a local-first pantry, shopping, recipe and cooking companion." />
  <meta name="color-scheme" content="light" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Mise" />

  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" type="image/svg+xml" href="./assets/icons/favicon.svg" />
  <link rel="apple-touch-icon" href="./assets/icons/icon-180.png" />
  <link rel="stylesheet" href="./src/css/styles.css" />

  <title>Mise — Cook with what you have</title>
</head>
<body>
  <div id="root"></div>
  <noscript>Mise needs JavaScript enabled.</noscript>

  <!--
    Build-free static app. The scripts stay classic (non-module) so the repo
    remains easy to host on GitHub Pages and can still be opened directly.
    Lucide is loaded from a pinned CDN build and is cached by the service worker
    after a successful hosted visit.
  -->
  <script defer src="https://unpkg.com/lucide@1.47.0"></script>
  <script defer src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script defer src="./src/js/runtime.js"></script>
  <script defer src="./src/js/icons.js"></script>
  <script defer src="./src/js/data.js"></script>
  <script defer src="./src/js/logic.js"></script>
  <script defer src="./src/js/app.js"></script>
  <script defer src="./src/js/pwa.js"></script>
</body>
</html>
